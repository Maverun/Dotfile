# vim: filetype=hyprlang
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
# DP-2 = Right monitor
# DP-1 = Middle monitor (main)
# HDMI-A-1 = Left monitor
# DP-3 = Top monitor


monitor=HDMI-A-1, 1920x1080@60, 0x1440,1
monitor=DP-1, 2560x1440@240, 1920x1080,1
monitor=DP-2, 1920x1080@60, 4480x1440,1
monitor=DP-3, 1920x1080, 1920x0,1
monitor=DP-3, disable

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$fileManager = thunar
# $menu = wofi --show drun
# $menu = tofi-run -c ~/.config/tofi/tokyonight_dmenu | xargs hyprctl dispatch exec --
$menu = tofi-run -c ~/.config/tofi/tokyonight_dmenu | xargs hyprctl dispatch exec --
$script = ~/Script
$hypr_script = ~/.config/hypr/scripts
$ipc = qs -c noctalia-shell ipc call

# ┌────────────────────────────────────────────────────────────────────────────┐
# │                           Environment Variables                            │
# └────────────────────────────────────────────────────────────────────────────┘

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = QT_QPA_PLATFORM,wayland;xcb
# env = GDK_BACKEND,wayland;x11
env = GDK_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
# env = SDL_VIDEODRIVER,wayland
# env = CLUTTER_BACKEND,wayland
env = BEMENU_OPTS, --tb ##1a1b26 --tf ##7dcfff --nb ##1a1b26 --nf ##c0caf5 --hb ##283457 --hf ##c0caf5 --ab ##292e42 --af ##c0caf5
env = HYPRCURSOR_THEME,rose-pine-hyprcursor

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true
    repeat_rate = 40
    repeat_delay = 210

    # 0 - Cursor movement will not change focus.
    # 1 - Cursor movement will always change focus to the window under the cursor.
    # 2 - Cursor focus will be detached from keyboard focus. Clicking on a window will move keyboard focus to that window.
    # 3 - Cursor focus will be completely separate from keyboard focus. Clicking on a window will not change keyboard focus.
    follow_mouse = 2
    mouse_refocus = false
    float_switch_override_focus = 2
    special_fallthrough = true

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 0
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    no_focus_fallback = false
    layout = dwindle

    # no_cursor_warps = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# dwindle {
#     # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
#     pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#     preserve_split = true # you probably want this
# }

# master {
#     # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#     new_is_master = true
# }

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    mouse_move_focuses_monitor = false
    middle_click_paste = false
    disable_splash_rendering = false
}
splash = false
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device:epic-mouse-v1 {
#     sensitivity = -0.5
# }


debug.disable_logs = false


# ┌────────────────────────────────────────────────────────────────────────────┐
# │                                Assign/Rules                                │
# └────────────────────────────────────────────────────────────────────────────┘

windowrule {
  name = windowrule-1
  idle_inhibit = fullscreen
  match:class = .*
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule {
  name = windowrule-2
  suppress_event = maximize
  match:class = .* # You'll probably like this.
}

windowrule {
  name = windowrule-3
  workspace = 9 silent
  match:title = $(Godot)$
}


windowrule {
  name = windowrule-4
  # stay_focused = on
  allows_input = on
  match:class = (gw2-64.exe)
}

# windowrule = allows_input on, match:class (gw2-64.exe)


windowrule = tile on, match:class (gw2-64.exe)
windowrule = workspace 9, match:class (gw2-64.exe)
# windowrule = fakefullscreen, gw2-64.exe
windowrule = tile on, match:title Guild Wars 2
windowrule = workspace 9, match:title Guild Wars 2
# windowrule = fakefullscreen, (Guild Wars 2)
workspace = 9, monitor:DP-1

# windowrule = fullscreen, Burrito

windowrule {
  name = windowrule-5
  workspace = 8
  no_follow_mouse = on
  no_initial_focus = on
  match:class = (mpv)
}

# windowrulev2 = monitor DP-3, title:(mpv)
windowrule {
  name = windowrule-6
  workspace = 5
  match:class = (thunderbird)
}

windowrule {
  name = windowrule-7
  float = on
  match:title = (yad)
}

windowrule {
  name = windowrule-8
  workspace = 4
  match:class = (discord)
}

windowrule {
  name = windowrule-9
  workspace = 4
  match:title = (weechat)
}

windowrule {
  name = windowrule-10
  workspace = 4
  match:title = (Fractal)
}

windowrule {
  name = windowrule-11
  float = on
  match:title = (satty)
}

windowrule {
  name = windowrule-12
  float = on
  center = on
  size = 800 800
  match:title = (Notetaker)
}

windowrule {
  name = windowrule-13
  float = on
  match:title = (Extension+Mozilla Firefox.*)
}

windowrule {
  name = windowrule-14
  opacity = 1 0.9
  match:class = (kitty)
}

windowrule {
  name = windowrule-15
  workspace = 1
  match:class = (firefox)
}

windowrule {
  name = windowrule-16
  workspace = 3
  match:title = (YouTube)
}

# windowrule=opacity 0.3 override 0.3 override,title:(.*)(YouTube)
windowrule {
  name = windowrule-17
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  match:class = ^(xwaylandvideobridge)$
}


windowrule {
  name = windowrule-18
  stay_focused = on
  min_size = 1 1
  match:title = ^(SteamVR Status)$
  match:class = ^(com.valvesoftware.vrmonitor)$
}

#Special Rules for Steam to get the drop-down and lower right “Add Game” menus to work right.
windowrule {
  name = windowrule-19
  stay_focused = on
  min_size = 1 1
  match:title = ^()$
  match:class = ^(steam)$
}

windowrule {
    name = "Arknight Enfield"
    match:title = "Enfield"
    tile = on
    float = off
    workspace = 9
}


windowrule {
    name = "Exilium"
    match:title = "*EXILIUM*"
    tile = on
    float = off
    workspace = 9
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}


workspace = 1, monitor:DP-1, default:true
workspace = 4, monitor:HDMI-A-1, default:true
workspace = 8, monitor:DP-3, default:true
workspace = 3, monitor:DP-2, default:true

# ┌────────────────────────────────────────────────────────────────────────────┐
# │                                  Startup                                   │
# └────────────────────────────────────────────────────────────────────────────┘

# exec-once=~/Script/wayland_startup
# exec=find $HOME/Wallpaper/Wallpaper -type f | shuf -n 1 | swaybg
exec-once= ~/Script/fix.sh
# exec-once= ~/Script/hyprlandEvent

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = corectrl --minimize-systray

# exec-once=swaybg --image $(find ~/Wallpaper/Wallpaper -type f | shuf -n 1)
# exec-once= sleep 5 && hyprpaper
# exec= sleep 6 && $hypr_script/hyprpaper_change_often.sh
# exec-once= hypridle
# exec-once= hyprpanel
exec-once = qs -c noctalia-shell
exec-once= systemctl --user start hyprpolkitagent
exec-once=~/home_venv/bin/python3 ~/Script/hyprlandEvent.py
exec-once=[workspace 2 silent] kitty
# exec-once=[workspace 6 silent] thunderbird
exec-once=/usr/lib/kdeconnectd --replace
exec-once=[workspace 8 silent] sleep 90 && kdeconnect-app
exec-once=[workspace 4 silent] webcord
# exec-once=[workspace 4 silent] fractal
exec-once=[workspace special:anime silent; float] kitty --class=trackma trackma
exec-once=[workspace 1 silent] firefox
# exec-once=dunst
# exec-once=waybar
exec-once=clipmenud
# exec-once=wlsunset -T 3900 -t 3600 -g 0.8 -l 43.6 -L -79.3
exec-once=synology-drive autostart
exec-once=protonmail-bridge --no-window
exec-once=protonvpn-app
# exec-once=sleep 30 && kitty -o 'map kitty_mod+e kitten hints --customize-processing weechat_hints.py' --class=weechat weechat &
exec-once=/usr/lib/polkit-kde-authentication-agent-1

# Disable middle paste.
# exec-once=wl-paste -p --watch wl-copy -p ''
# bind = , mouse:274, exec, ;

# ┌────────────────────────────────────────────────────────────────────────────┐
# │                                  Keyblind                                  │
# └────────────────────────────────────────────────────────────────────────────┘

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$hyper = SUPER CTRL ALT SHIFT

# Sub mode http://wiki.hyprland.org/Configuring/Binds/#submaps

# 2. Resize
bind=SUPER,R,submap,resize #"Resize Mode"
submap=resize
binde=,L,resizeactive,10 0 #"Resize Right"
binde=,J,resizeactive,0 10 #"Resize Down"
binde=,K,resizeactive,0 -10 #"Resize Up"
binde=,H,resizeactive,-10 0 #"Resize Left"
# use reset to go back to the global submap
bind=,escape,submap,reset #"Escape mode"
# will reset the submap, meaning end the current one and return to the global one
submap=reset

# 3. Program launcher
bind=SUPER,P,submap,program_launcher #"Program Launcher"
submap=program_launcher
binde=,F, exec, firefox #"Firefox"
binde=,E, exec, $fileManager #"File Manager"
binde=,C, exec, gnome-clock #"Gnome Clock"
binde=,S, exec, ~/Script/shutdownMenu #"Shutdown Menu"
binde=,F, submap, reset
binde=,E, submap, reset
binde=,C, submap, reset
binde=,S, submap, reset
# use reset to go back to the global submap
bind=,escape,submap,reset #"Escape mode"
# will reset the submap, meaning end the current one and return to the global one
submap=reset


# 2. Screenshot
binde=$hyper,S, exec, grim -g "$(slurp -d)" -| wl-copy #"Screenshot"
bind=$hyper,E,submap,screenshot #"Screenshot Mode"
submap=screenshot
# Edit of region select.
binde=,A, exec, grim -g "$(slurp -d)" - | satty --filename '-' --early-exit #"Edit Screenshot with Region select"
# Whole screen of currently monitor
binde=,W, exec,grim -o $(hyprctl activeworkspace | awk '/on monitor/{print $7}' | awk 'sub(":","")') - | wl-copy #"Whole screen screenshot"
# Edit whole screen of currently monitor
binde=,E, exec,grim -o $(hyprctl activeworkspace | awk '/on monitor/{print $7}' | awk 'sub(":","")') - | satty --filename '-' --early-exit #"Whole screenshot Edit"
binde=,R, exec, replay-sorcery save
binde=,A, submap, reset
binde=,W, submap, reset
binde=,E, submap, reset
binde=,R, submap, reset
# use reset to go back to the global submap
bind=,escape,submap,reset #"Escape Mode"
submap=reset

# 2. Monitor Mode
bind=$hyper,m,submap,monitorMode #"Monitor Mode"
submap=monitorMode
binde=,1, exec, $hypr_script/monitorSet 1Monitor #"One Monitor (Center)"
binde=,h, exec, $hypr_script/monitorSet 2MonitorLeft #"Two Monitor with left"
binde=,l, exec, $hypr_script/monitorSet 2MonitorRight #"2 Monitor with right"
binde=,3, exec, $hypr_script/monitorSet 3Monitor #"3 Monitor (Default)"
binde=,4, exec, $hypr_script/monitorSet 4Monitor #"4 Monitor(Including top)"
binde=,1, submap, reset
binde=,h, submap, reset
binde=,l, submap, reset
binde=,3, submap, reset
binde=,4, submap, reset
# use reset to go back to the global submap
bind=,escape,submap,reset #"Escape mode"
# will reset the submap, meaning end the current one and return to the global one
submap=reset

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal #"Terminal"
bind = $mainMod SHIFT, C, killactive #"Close/Kill"
bind = $mainMod SHIFT, M, exit #"Exit"
bind = $mainMod, Y, exec, $menu #"Menu Launcher"
bind = $mainMod, PERIOD, exec, notify-send "$(hyprctl activewindow | sed -n -e 9p -e 10p -e 11p -e 12p)" #"Window information"
bind = $mainMod, PERIOD, exec, notify-send "$(hyprctl activewindow)"
bind = $mainMod, F, fullscreen #"Fullscreen"
# bind = $mainMod SHIFT, F, fullscreen, 1 #"Fullscreen
bind = $mainMod SHIFT, P, pin #"Pin"
bind = $mainMod, SPACE, focuswindow, floating #"Floating Focus"
bind = $mainMod SHIFT, SPACE, togglefloating #"Floating Toggle"
bind = $hyper, A, togglespecialworkspace, anime #"Anime Trackma"
# bind = $hyper, L, exec, hyprlock #"HyprLock"
# bind = $hyper, O , exec, killall waybar && waybar

# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Script running
# 1. Scripts
bind = $hyper, E, exec, $script/config_edit #"Config Edit"
bind = $hyper, K, exec, $script/kill_process #"Kill Process"
bind = $hyper, F, exec, $script/search #"Search"
bind = $hyper, D, exec, $script/discord_macro #"Discord Marco"
bind = $hyper, R, exec, $script/runScript #"Run script"
bind = $hyper, T, exec, $script/add_todo #"Todo list"
bind = $mainMod, O, exec, $script/hyprlandFindWindow #"Find window"
bind = $hyper, N, exec, [float] kitty --class=Notetaker sh ~/Script/notetaker #"Floating Note taker"
bind = $mainMod, D, exec, $hypr_script/toggle_show_desktop.sh #"Show desktop"
bind = $hyper, W, exec, $hypr_script/hyprpaper_change_often.sh #"Change wallpaper"


# Music/Audio stuff
# 2. Audio
bind = , XF86AudioPlay, exec, python $script/mpv_cmus.py play-pause #"Play MPV/Media"
bind = , XF86AudioStop, exec, python $script/mpv_cmus.py stop #"Stop MPV/Media"
bind = , XF86AudioPrev, exec, python $script/mpv_cmus.py prev #"Prev MPV/Media"
bind = , XF86AudioNext, exec, python $script/mpv_cmus.py next #"Next MPV/Media"
# bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
# binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
# binde = , Shift+XF86AudioRaiseVolume, exec, playerctl volume 0.1+
# binde = , Shift+XF86AudioLowerVolume, exec, playerctl volume 0.1-

bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase #"Volume Increase"
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease #"Volume Decrease"
bindl = , XF86AudioMute, exec, $ipc volume muteOutput #"Volume mute"
# bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
# bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# 1. Window Management
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l #"Focus Left"
bind = $mainMod, right, movefocus, r #"Focus Right"
bind = $mainMod, up, movefocus, u #"Focus Up"
bind = $mainMod, down, movefocus, d #"Focus Down"

bind = $mainMod, H, movefocus, l #"Focus Left"
bind = $mainMod, L, movefocus, r #"Focus Right"
bind = $mainMod, K, movefocus, u #"Focus Up"
bind = $mainMod, J, movefocus, d #"Focus Down"

# Move window
bind = $mainMod SHIFT, H, movewindow, l #"Move Left"
bind = $mainMod SHIFT, L, movewindow, r #"Move Right"
bind = $mainMod SHIFT, K, movewindow, u #"Move Up"
bind = $mainMod SHIFT, J, movewindow, d #"Move Down"

# Move window
binde = $mainMod ALT, H, resizeactive, -5 0 #"Resize Left"
binde = $mainMod ALT, L, resizeactive, 5 0  #"Resize Right"
binde = $mainMod ALT, K, resizeactive, 0 -5 #"Resize Up"
binde = $mainMod ALT, J, resizeactive, 0 5  #"Resize Down"

# 1. Workspace

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 #"Switch to workspace 1"
bind = $mainMod, 2, workspace, 2 #"Switch to workspace 2"
bind = $mainMod, 3, workspace, 3 #"Switch to workspace 3"
bind = $mainMod, 4, workspace, 4 #"Switch to workspace 4"
bind = $mainMod, 5, workspace, 5 #"Switch to workspace 5"
bind = $mainMod, 6, workspace, 6 #"Switch to workspace 6"
bind = $mainMod, 7, workspace, 7 #"Switch to workspace 7"
bind = $mainMod, 8, workspace, 8 #"Switch to workspace 8"
bind = $mainMod, 9, workspace, 9 #"Switch to workspace 9"
bind = $mainMod, 0, workspace, 10 #"Switch to workspace 10"

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Send Window to workspace 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Send Window to workspace 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Send Window to workspace 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Send Window to workspace 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Send Window to workspace 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Send Window to workspace 6"
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #"Send Window to workspace 7"
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #"Send Window to workspace 8"
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #"Send Window to workspace 9"
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #"Send Window to workspace 10"

# Move window to according to direction you select to monitor.
bind = $mainMod CTRL, H, movewindow, mon:l #"Move to Left monitor"
bind = $mainMod CTRL, L, movewindow, mon:r #"Move to Right monitor"
bind = $mainMod CTRL, K, movewindow, mon:u #"Move to Up monitor"
bind = $mainMod CTRL, J, movewindow, mon:d #"Move to Down monitor"

# move workspace to other monitor
bind = $mainMod CTRL SHIFT, H, movecurrentworkspacetomonitor, l #"Move Workspace to left monitor"
bind = $mainMod CTRL SHIFT, L, movecurrentworkspacetomonitor, r #"Move Workspace to right monitor"
bind = $mainMod CTRL SHIFT, K, movecurrentworkspacetomonitor, u #"Move Workspace to up monitor"
bind = $mainMod CTRL SHIFT, J, movecurrentworkspacetomonitor, d #"Move Workspace to down monitor"
# bind = $mainMod CTRL SHIFT, H, focuscurrentorlast
# bind = $mainMod CTRL SHIFT, L, focuscurrentorlast
# bind = $mainMod CTRL SHIFT, K, focuscurrentorlast
# bind = $mainMod CTRL SHIFT, J, focuscurrentorlast
# Example special workspace (scratchpad)

# 2. Misc
bind = $mainMod, S, togglespecialworkspace, magic #"Toggle Special Workspace"
bind = $mainMod SHIFT, S, movetoworkspace, special:magic #"Move it to special workspace"

# Group stuff
bind = $mainMod, E, togglegroup #"Toggle Group"
bind = $mainMod, tab, changegroupactive, f #"Change Group Active"
bind = $mainMod SHIFT, tab, changegroupactive, b #"Change Group Active


# Scroll through existing workspaces with mainMod + scroll
bind = $hyper, mouse_down, workspace, e+1
bind = $hyper, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $hyper, mouse:272, movewindow
bindm = $hyper, mouse:273, resizewindow

# Window layout

# Noctalia quickshell
bind = $mainMod, comma, exec, $ipc settings toggle #"Noctalia Setting toggle"
bind = $hyper, C, exec, $ipc controlCenter toggle #"Noctalia Control Center"
bind = $hyper, P, exec, $ipc sessionMenu toggle
bind = $hyper, L, exec, $ipc lockScreen lock #"Lock the screen"
bind = $mainMod, F1, exec, $ipc plugin:keybind-cheatsheet toggle #"Hyprland Cheatsheet"

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
